name: webOS IPK build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Read version
        id: ver
        run: echo "name=$(jq -r .version ipk/app/appinfo.json)" >> "$GITHUB_OUTPUT"

      - name: Package IPK
        working-directory: ipk
        run: |
          ares-package app -o .
          ares-package -I cz.qikseek.wflix_${{ steps.ver.outputs.name }}_all.ipk

      - name: Upload IPK
        uses: actions/upload-artifact@v7
        with:
          path: ipk/cz.qikseek.wflix_${{ steps.ver.outputs.name }}_all.ipk
          archive: false
          if-no-files-found: error
