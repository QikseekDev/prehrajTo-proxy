name: webOS IPK build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # jen kvůli zápisu zvýšené verze zpět do main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Bump version (push to main)
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # verze se zvyšuje jen když se změnila appka (ne jen appinfo.json)
          if [ -z "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- ipk/app ':!ipk/app/appinfo.json' 2>/dev/null)" ]; then
            echo "Žádná změna v ipk/app - verze zůstává"
            exit 0
          fi
          F=ipk/app/appinfo.json
          VER=$(jq -r .version "$F")
          # Schéma X.Y.Z = velké vylepšení . normální změna . něco, co bych radši neříkal
          # Vynucení typu: [bump:velke|major] / [bump:normalni|minor] / [bump:spatne|patch]; jinak Z
          MSG="$(git log -1 --pretty=%B 2>/dev/null || true)"
          IFS='.' read -r X Y Z <<< "$VER"
          X=${X:-0}; Y=${Y:-0}; Z=${Z:-0}
          if echo "$MSG" | grep -Eqi '\[bump:(velke|major)\]'; then
            X=$((X+1)); Y=0; Z=0
          elif echo "$MSG" | grep -Eqi '\[bump:(normalni|minor)\]'; then
            Y=$((Y+1)); Z=0
          else
            Z=$((Z+1))
          fi
          NEW="$X.$Y.$Z"
          sed -i "s/\"version\": \"$VER\"/\"version\": \"$NEW\"/" "$F"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Verze $VER -> $NEW [schema velke.normalni.spatne]"
      - name: Read version
        id: ver
        run: echo "name=$(jq -r .version ipk/app/appinfo.json)" >> "$GITHUB_OUTPUT"

      - name: Package IPK
        working-directory: ipk
        run: |
          ares-package app -o .
          ares-package -I cz.qikseek.wflix_${{ steps.ver.outputs.name }}_all.ipk

      - name: Upload IPK
        uses: actions/upload-artifact@v7
        with:
          path: ipk/cz.qikseek.wflix_${{ steps.ver.outputs.name }}_all.ipk
          archive: false
          if-no-files-found: error

      - name: Commit version bump
        if: success() && steps.bump.outputs.new != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipk/app/appinfo.json
          git commit -m "chore(ipk): verze ${{ steps.bump.outputs.new }} [skip ci]"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Nepodařilo se zapsat zvýšenou verzi do main"
          exit 1
