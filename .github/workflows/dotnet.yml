name: Backend build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        working-directory: azure-app/PrehrajtoProxy
        run: dotnet restore

      - name: Build
        working-directory: azure-app/PrehrajtoProxy
        run: dotnet build --no-restore
