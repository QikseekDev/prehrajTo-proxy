name: Deploy PHP proxy to Webzdarma (FTP)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.php'
      - 'router.php'
      - '.github/workflows/deploy-webzdarma-ftp.yml'

permissions:
  contents: read

concurrency:
  group: webzdarma-ftp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload to ${{ matrix.username }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - username: vokounvojta03-3385.wz.cz
          - username: vokounvojta03-3621.wz.cz
          - username: vokounvojta03-9456.wz.cz

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy payload
        run: |
          mkdir -p deploy
          cp index.php router.php deploy/
          ls -la deploy

      - name: Deploy via FTP (with retry)
        uses: nick-fields/retry@v3
        env:
          FTP_HOST_PRIMARY: ftp5.webzdarma.cz
          FTP_HOST_FALLBACK: ftp.webzdarma.cz
          FTP_USER: ${{ matrix.username }}
          # Heslo je uloženo v GitHub jako secret WZ_PASSWORD (stejné pro všechny 3 účty).
          # Pokud ho máte jako Actions variable, změňte na: ${{ vars.WZ_PASSWORD }}
          FTP_PASS: ${{ secrets.WZ_PASSWORD }}
        with:
          timeout_minutes: 8
          max_attempts: 4
          retry_wait_seconds: 25
          shell: bash
          command: |
            set -euo pipefail
            upload_to_host() {
              local host="$1"
              echo "Trying FTP host: $host"
              for f in index.php router.php; do
                echo "Uploading $f -> ftp://$host/$f"
                curl --fail --show-error --silent \
                  --ftp-pasv \
                  --connect-timeout 20 \
                  --max-time 120 \
                  -T "deploy/$f" \
                  --user "$FTP_USER:$FTP_PASS" \
                  "ftp://$host/$f"
              done
              echo "Listing uploaded files on $host"
              curl --fail --show-error --silent \
                --ftp-pasv \
                --connect-timeout 20 \
                --max-time 60 \
                --user "$FTP_USER:$FTP_PASS" \
                "ftp://$host/" | sed -n '1,40p' || true
            }
            upload_to_host "$FTP_HOST_PRIMARY" || upload_to_host "$FTP_HOST_FALLBACK"
