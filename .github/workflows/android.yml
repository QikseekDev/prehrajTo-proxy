name: Android APK build

on:
  push:
    branches: [ main ]
    paths: [ 'apk/**', '.github/workflows/android.yml' ]
    tags: [ 'v*' ]
  pull_request:
    paths: [ 'apk/**', '.github/workflows/android.yml' ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # jen kvůli publikaci GitHub Release u tagů
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Výchozí seznam balíčků akce je "tools platform-tools", ale "tools" už
          # v novějších cmdline-tools není - sdkmanager skončí chybou
          # "Failed to find package 'tools'". Instaluje se proto jen to, co build
          # potřebuje: compileSdk 34, build-tools 34.0.0 (apksigner) a platform-tools.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Bump version (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          F=apk/app/build.gradle
          CODE=$(grep -oP "versionCode \K[0-9]+" "$F")
          NAME=$(grep -oP "versionName '\K[^']+" "$F")
          NEW_CODE=$((CODE + 1))
          NEW_NAME="${NAME%.*}.$(( ${NAME##*.} + 1 ))"
          sed -i "s/versionCode $CODE\$/versionCode $NEW_CODE/; s/versionName '$NAME'/versionName '$NEW_NAME'/" "$F"
          echo "BUMPED_VERSION=$NEW_NAME" >> "$GITHUB_ENV"
          echo "Verze $NAME ($CODE) -> $NEW_NAME ($NEW_CODE)"

      - name: Read version
        id: ver
        working-directory: apk
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME neodpovídá versionName $VER v apk/app/build.gradle"
            exit 1
          fi

      - name: Prepare release keystore
        env:
          KS_B64: ${{ secrets.WFLIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wflix.jks"
            echo "WFLIX_STORE_FILE=$RUNNER_TEMP/wflix.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret WFLIX_KEYSTORE_BASE64 není nastavený - APK bude podepsaný pevným debug klíčem z repa (apk/app/debug.keystore) - aktualizace přes sebe funguje, ale pro distribuci nastav vlastní keystore. Viz apk/README.md."
          fi

      - name: Assemble release
        working-directory: apk
        env:
          WFLIX_STORE_PASSWORD: ${{ secrets.WFLIX_STORE_PASSWORD }}
          WFLIX_KEY_ALIAS: ${{ secrets.WFLIX_KEY_ALIAS }}
          WFLIX_KEY_PASSWORD: ${{ secrets.WFLIX_KEY_PASSWORD }}
          WFLIX_REQUIRE_RELEASE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Wflix-${{ steps.ver.outputs.name }}.apk"

      - name: Verify signature and checksum
        working-directory: apk
        run: |
          APK="Wflix-${{ steps.ver.outputs.name }}.apk"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: apk/Wflix-${{ steps.ver.outputs.name }}.apk
          archive: false
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: apk/Wflix-${{ steps.ver.outputs.name }}.apk.sha256
          archive: false
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/Wflix-${{ steps.ver.outputs.name }}.apk
            apk/Wflix-${{ steps.ver.outputs.name }}.apk.sha256
          generate_release_notes: true

      # Verze se do repa zapíše až po úspěšném buildu, takže neúspěšný build nic nezvýší.
      # Push přes GITHUB_TOKEN další workflow nespouští, takže to nezacyklí.
      - name: Commit version bump
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/app/build.gradle
          git commit -m "chore(apk): verze $BUMPED_VERSION [skip ci]"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Nepodařilo se zapsat zvýšenou verzi do main"
          exit 1
