name: Deploy to MonsterASP.NET

# Zdarma varianta "auto pull + build + publish": build běží na GitHub Actions,
# na hosting se posílá jen hotový publish výstup přes Web Deploy (inkrementálně).
# Free plán MonsterASP nemá auto-deploy webhook (ten je Premium), tohle ho nahradí.
#
# Nasazuje se do dvou webů (stejný build, každý má vlastní Web Deploy účet):
#   Wflix - site104887.siteasp.net  (wflix.runasp.net)
#   WTZI  - site104437.siteasp.net  (wtzi.runasp.net)
# Návod k nastavení: azure-app/DEPLOY-MONSTERASP.md

on:
  push:
    branches: [ main ]
    paths:
      - 'azure-app/PrehrajtoProxy/**'
      - '.github/workflows/deploy-monsterasp.yml'
      - '.github/scripts/deploy-webdeploy.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monsterasp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nasazení poběží jen pokud projdou všechny kontroly (push-checks.yml).
  checks:
    uses: ./.github/workflows/push-checks.yml

  deploy:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: >
          dotnet publish azure-app/PrehrajtoProxy/PrehrajtoProxy.csproj
          --configuration Release
          --output publish
          -p:SourceRevisionId=${{ github.sha }}

      # --- Wflix -------------------------------------------------------
      - name: Check Wflix Web Deploy password
        id: wflix
        shell: bash
        env:
          PW: ${{ secrets.WFLIX_SERVER_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WFLIX_SERVER_PASSWORD neni nastaven - deploy na Wflix preskocen (viz azure-app/DEPLOY-MONSTERASP.md)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Wflix (site104887)
        if: steps.wflix.outputs.configured == 'true'
        shell: pwsh
        env:
          SITE: ${{ secrets.WFLIX_WEBSITE_NAME || 'site104887' }}
          SERVER: ${{ secrets.WFLIX_SERVER_COMPUTER_NAME || 'https://site104887.siteasp.net:8172' }}
          USER: ${{ secrets.WFLIX_SERVER_USERNAME || 'site104887' }}
          PASS: ${{ secrets.WFLIX_SERVER_PASSWORD }}
          PUBLIC_URL: ${{ secrets.WFLIX_PUBLIC_URL || 'https://wflix.runasp.net' }}
        run: |
          ./.github/scripts/deploy-webdeploy.ps1 `
            -SourcePath "$(Get-Location)\publish" `
            -Site $env:SITE -Server $env:SERVER -User $env:USER -Password $env:PASS `
            -WaitUrl $env:PUBLIC_URL

      - name: Verify Wflix runs this commit
        if: steps.wflix.outputs.configured == 'true'
        shell: bash
        env:
          URL: ${{ secrets.WFLIX_PUBLIC_URL || 'https://wflix.runasp.net' }}
          SHA: ${{ github.sha }}
        run: |
          body=""
          for i in $(seq 1 20); do
            body=$(curl -fsS -m 20 "$URL/api/version" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "$SHA"; then
              echo "OK: $URL bezi commit $SHA"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$URL nevraci commit $SHA (posledni odpoved: $body)"
          exit 1

      # --- WTZI --------------------------------------------------------
      - name: Check WTZI Web Deploy password
        id: wtzi
        shell: bash
        env:
          PW: ${{ secrets.WTZI_SERVER_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WTZI_SERVER_PASSWORD neni nastaven - deploy na WTZI preskocen (viz azure-app/DEPLOY-MONSTERASP.md)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to WTZI (site104437)
        if: steps.wtzi.outputs.configured == 'true'
        shell: pwsh
        env:
          SITE: ${{ secrets.WTZI_WEBSITE_NAME || 'site104437' }}
          SERVER: ${{ secrets.WTZI_SERVER_COMPUTER_NAME || 'https://site104437.siteasp.net:8172' }}
          USER: ${{ secrets.WTZI_SERVER_USERNAME || 'site104437' }}
          PASS: ${{ secrets.WTZI_SERVER_PASSWORD }}
          PUBLIC_URL: ${{ secrets.WTZI_PUBLIC_URL || 'https://wtzi.runasp.net' }}
        run: |
          ./.github/scripts/deploy-webdeploy.ps1 `
            -SourcePath "$(Get-Location)\publish" `
            -Site $env:SITE -Server $env:SERVER -User $env:USER -Password $env:PASS `
            -WaitUrl $env:PUBLIC_URL

      - name: Verify WTZI runs this commit
        if: steps.wtzi.outputs.configured == 'true'
        shell: bash
        env:
          URL: ${{ secrets.WTZI_PUBLIC_URL || 'https://wtzi.runasp.net' }}
          SHA: ${{ github.sha }}
        run: |
          body=""
          for i in $(seq 1 20); do
            body=$(curl -fsS -m 20 "$URL/api/version" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "$SHA"; then
              echo "OK: $URL bezi commit $SHA"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$URL nevraci commit $SHA (posledni odpoved: $body)"
          exit 1
