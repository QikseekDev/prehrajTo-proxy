    <!-- Světlý režim se musí zapnout dřív než první vykreslení, jinak stránka blikne tmavě. -->
    <script>
        try {
            var wfSaved = JSON.parse(localStorage.getItem('wflix-settings') || '{}');
            if (wfSaved.theme === 'light') {
                document.documentElement.dataset.theme = 'light';
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f5f5');
            }
        } catch (e) {}
    </script>

    <!-- Top bar -->
    <header class="nav" id="nav">
        <div class="logo" onclick="goHome()" title="Domů">Wflix</div>
        <nav class="nav-links">
            <a onclick="goHome()">Domů</a>
            <a onclick="goHome(); setChip('České')">České filmy</a>
            <a onclick="goHome(); setChip('Rodinné')">Rodinné</a>
            <a onclick="goHome(); setChip('Sci-fi')">Sci-fi</a>
        </nav>
        <button class="nav-live" id="liveBtn" type="button" title="Živé vysílání">
            <svg class="live-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3l4 3 4-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 10.8v4.4l4-2.2z" fill="currentColor"/></svg>Živě
        </button>
        <!-- Který proxy server právě odpovídá (backend je střídá, když jeden vypadne) -->
        <span class="src-badge" id="srcBadge" hidden title=""><i></i><span id="srcBadgeName"></span></span>
        <div class="search-box" id="searchBox">
            <button id="searchBtn" onclick="searchMovies()" aria-label="Hledat" title="Hledat">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 20.6 20.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="search-spinner" aria-hidden="true"></span>
            </button>
            <input type="text" id="searchInput" placeholder="Hledat filmy a seriály" autocomplete="off">
        </div>
        <div class="settings-wrap" id="settingsWrap">
            <button class="profile-btn" id="profileBtn" type="button" aria-label="Nastavení" title="Nastavení" onclick="openSettings()">
                <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="13" r="2.6" fill="#101010"/><circle cx="21" cy="13" r="2.6" fill="#101010"/><path d="M10 20.5c1.9 2.6 4 3.9 6 3.9s4.1-1.3 6-3.9" stroke="#101010" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
            </button>
        </div>
    </header>

    <div class="container">
        <div id="status" class="status"></div>

        <!-- Results -->
        <div id="resultsSection" class="results-section">
            <div id="resultsState" class="results-state"></div>
            <div id="resultsInfo" class="results-info"></div>
            <div id="resultsGrid" class="results-grid"></div>
        </div>

        <!-- Player -->
        <div id="playerSection" class="player-section">
            <button class="back-btn" onclick="goBack()">← Zpět</button>
            <div class="video-container">
                <video id="videoPlayer" controls></video>
                <div class="player-end" id="playerEnd" hidden>
                    <h3 class="player-end-title" id="playerEndTitle"></h3>
                    <div class="player-end-actions">
                        <button type="button" class="btn-play" id="endReplayBtn">↻ Pustit znovu</button>
                        <button type="button" class="btn-info" id="endHomeBtn">Domovská stránka</button>
                        <button type="button" class="btn-info" id="endSearchBtn">Hledat další</button>
                    </div>
                </div>
            </div>
            <div id="nowPlaying" class="now-playing"></div>
            <div class="player-actions">
                <a id="dlBtn" class="dl-btn" href="#" download>⬇ Stáhnout video</a>
                <button type="button" id="proxyBtn" class="dl-btn" hidden>▶ Přehrát přes server</button>
                <button type="button" id="favBtn" class="dl-btn" hidden>☆ Do oblíbených</button>
                <button type="button" id="pipBtn" class="dl-btn" hidden title="Obrázek v obraze">⧉ PiP</button>
                <span class="sub-pick" id="subtitleBar" hidden>
                    <label for="subtitleSelect">Titulky</label>
                    <select id="subtitleSelect" class="set-select" aria-label="Titulky"></select>
                    <span class="sub-note" id="subNote" hidden>Titulky se nepodařilo načíst</span>
                </span>
                <span class="src-mode" id="srcMode" hidden></span>
            </div>
            <div class="player-keys" id="playerKeys">
                Klávesy: <b>mezerník</b> přehrát/pauza · <b>← →</b> posun o 10 s · <b>↑ ↓</b> hlasitost · <b>F</b> celá obrazovka
            </div>
        </div>

        <!-- Živé vysílání: kanály z IPTV seznamů, přehrává hls.js -->
        <div id="liveSection" class="live-section">
            <div class="live-head">
                <h1 class="live-title">Živě</h1>
                <div class="live-tools">
                    <div class="lsrc" id="liveSrc">
                        <input type="hidden" id="liveSource" value="cz">
                        <button type="button" class="lsrc-btn" id="liveSrcBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Zdroj kanálů">
                            <span id="liveSrcLabel">Česko</span>
                            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <div class="lsrc-menu" id="liveSrcMenu">
                            <input class="lsrc-search" id="liveSrcSearch" type="search" placeholder="Hledat zemi…" autocomplete="off" aria-label="Hledat zemi">
                            <div class="lsrc-list" id="liveSrcList" role="listbox"></div>
                        </div>
                    </div>
                    <input class="live-filter" id="liveFilter" type="search" placeholder="Filtrovat kanály…" autocomplete="off" aria-label="Filtrovat kanály">
                </div>
            </div>
            <div class="live-tags" id="liveTags">
                <button class="lchip active" data-flag="all" type="button">Vše</button>
                <button class="lchip" data-flag="hd" type="button">1080p</button>
                <button class="lchip" data-flag="noGeo" type="button">Bez geo bloku</button>
                <button class="lchip" data-flag="only24" type="button">Jen 24/7</button>
            </div>
            <div id="liveState" class="results-state"></div>
            <div id="liveGrid" class="live-grid"></div>
        </div>

        <!-- Přehrávač živého vysílání -->
        <div id="livePlayerSection" class="player-section">
            <button class="back-btn" id="liveBackBtn">← Zpět na živě</button>
            <div class="video-container">
                <video id="liveVideo" controls playsinline></video>
            </div>
            <div id="liveNow" class="now-playing"></div>
            <div id="liveError" class="live-error" hidden></div>
        </div>

        <!-- Statické stránky (odkazy v patičce) -->
        <div id="pageSection" class="page-section">
            <button class="back-btn" id="pageBackBtn" onclick="closePage()">← Zpět</button>
            <h1 class="page-title" id="pageTitle"></h1>
            <div class="page-body" id="pageBody"></div>
        </div>

        <!-- Homepage catalog -->
        <div id="placeholder" class="catalog">
            <div id="hero"></div>
            <div id="chips" class="chips"></div>
            <div id="catalogRows"></div>
        </div>
    </div>

    <!-- Patička po vzoru Netflixu -->
    <footer class="footer">
        <div class="f-ask">Máte otázky? <button type="button" class="f-link" onclick="openPage('contact')">Kontaktujte nás.</button></div>
        <div class="f-links">
            <button type="button" class="f-link" onclick="openPage('help')">Centrum nápovědy</button>
            <button type="button" class="f-link" onclick="openPage('about')">O projektu</button>
            <button type="button" class="f-link" onclick="openPage('sources')">Zdroje a technologie</button>
            <button type="button" class="f-link" onclick="openPage('terms')">Podmínky užití</button>
            <button type="button" class="f-link" onclick="openPage('privacy')">Ochrana soukromí</button>
            <button type="button" class="f-link" onclick="openPage('cookies')">Předvolby cookies</button>
            <button type="button" class="f-link" onclick="openPage('contact')">Kontakt</button>
        </div>
        <div class="f-copy">© 2026 Wflix · Proxy pro přehrávání videí z prehraj.to</div>
    </footer>

    <script src="script.js?v=20261106-1"></script>
</body>
