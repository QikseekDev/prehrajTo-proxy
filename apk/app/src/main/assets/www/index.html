<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">

  <!-- ===================== Aplikace ===================== -->
  <div id="shell" class="shell" hidden>
    <nav id="rail" class="rail" aria-label="Hlavní navigace">
      <div class="rail-logo">Wflix</div>
      <button class="navbtn f" data-nav="search" type="button"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-search" xlink:href="#i-search"/></svg></span><span class="lbl">Hledat</span></button>
      <button class="navbtn f" data-nav="home" type="button"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-home" xlink:href="#i-home"/></svg></span><span class="lbl">Domů</span></button>
      <button class="navbtn f" data-nav="live" type="button"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-live" xlink:href="#i-live"/></svg></span><span class="lbl">Živě</span></button>
      <div class="rail-group">Kategorie</div>
      <button class="navbtn f cat" data-cat="České" type="button"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-film" xlink:href="#i-film"/></svg></span><span class="lbl">České</span></button>
      <button class="navbtn f cat" data-cat="Rodinné" type="button"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-film" xlink:href="#i-film"/></svg></span><span class="lbl">Rodinné</span></button>
      <button class="navbtn f" data-nav="library" type="button"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-star" xlink:href="#i-star"/></svg></span><span class="lbl">Knihovna</span></button>
      <div class="rail-spacer"></div>
      <button class="navbtn f" data-nav="settings" type="button"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-settings" xlink:href="#i-settings"/></svg></span><span class="lbl">Nastavení</span></button>
    </nav>

    <main id="main" class="main">
      <section id="view-home" class="view active">
        <div id="hero" class="hero"></div>
        <div id="rows" class="rows"></div>
      </section>

      <section id="view-library" class="view">
        <div class="page-head"><h1 class="page-title">Knihovna</h1></div>
        <div id="libRows" class="rows"></div>
      </section>

      <section id="view-search" class="view">
        <div class="page-head search-head">
          <h1 class="page-title">Hledat</h1>
          <div class="searchbar">
            <span class="s-ico" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="#i-search" xlink:href="#i-search"/></svg></span>
            <input id="searchInput" class="search-input f" type="text" autocomplete="off"
                   spellcheck="false" placeholder="Název filmu nebo seriálu" enterkeyhint="search" aria-label="Hledat film nebo seriál">
            <button id="searchGo" class="f btn" type="button">Hledat</button>
          </div>
        </div>
        <div class="search-layout">
          <div class="search-side">
            <div id="searchField" class="search-field empty">
              <span class="s-ico" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="#i-search" xlink:href="#i-search"/></svg></span>
              <input id="searchText" class="search-text" type="text" readonly autocomplete="off" spellcheck="false" aria-label="Hledaný text" placeholder="Hledat filmy a seriály">
            </div>
            <div id="skeys" class="skeys"></div>
          </div>
          <div class="search-main">
            <div id="searchHint" class="search-hint"></div>
            <div id="searchGrid" class="grid"></div>
            <div id="searchState" class="state"></div>
          </div>
        </div>
      </section>

      <section id="view-live" class="view">
        <div class="page-head">
          <h1 class="page-title">Živé vysílání</h1>
          <div id="liveChips" class="chips"></div>
        </div>
        <div id="liveGrid" class="channels"></div>
        <div id="liveState" class="state"></div>
      </section>

      <section id="view-settings" class="view">
        <div class="page-head"><h1 class="page-title">Nastavení</h1></div>
        <div id="settingsList" class="settings"></div>
        <p class="muted small pad">Wflix <span id="verLine"></span> · Obsah se nehostuje, klient jen zprostředkovává prehraj.to.</p>
      </section>
    </main>
  </div>

  <!-- ===================== Detail ===================== -->
  <div id="detail" class="overlay detail" hidden>
    <div class="detail-bg" id="detailBg"></div>
    <div class="detail-body">
      <img id="detailPoster" class="detail-poster" alt="">
      <div class="detail-info">
        <h1 id="detailTitle"></h1>
        <div id="detailMeta" class="meta"></div>
        <p id="detailNote" class="muted detail-note"></p>
        <div class="detail-actions">
          <button id="detailPlay" class="f btn primary" type="button"><svg class="i fill" aria-hidden="true"><use href="#i-play" xlink:href="#i-play"/></svg><span>Přehrát</span></button>
          <button id="detailFav" class="f btn ghost" type="button"><svg class="i" aria-hidden="true"><use href="#i-star" xlink:href="#i-star"/></svg><span>Do oblíbených</span></button>
          <button id="detailDl" class="f btn ghost" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-download" xlink:href="#i-download"/></svg><span>Stáhnout</span></button>
          <button id="detailClose" class="f btn ghost" type="button">Zavřít</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== Seriál ===================== -->
  <div id="series" class="overlay series" hidden>
    <div class="series-bg" id="seriesBg"></div>
    <div class="series-panel">
      <div class="series-head">
        <img id="seriesPoster" class="series-poster" alt="">
        <div class="series-info">
          <h1 id="seriesTitle"></h1>
          <div id="seriesMeta" class="meta"></div>
          <div class="detail-actions">
            <button id="seriesFav" class="f btn ghost" type="button"><svg class="i" aria-hidden="true"><use href="#i-star" xlink:href="#i-star"/></svg><span>Do oblíbených</span></button>
            <button id="seriesClose" class="f btn ghost" type="button">Zpět na výsledky</button>
          </div>
        </div>
      </div>
      <div id="seriesBody" class="series-body"></div>
      <div id="seriesNote" class="series-note" hidden></div>
    </div>
  </div>

  <!-- ===================== Přehrávač ===================== -->
  <div id="player" class="overlay player" hidden>
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
    <div id="pTop" class="p-top">
      <button id="pBack" class="f p-btn" type="button"><svg class="i" aria-hidden="true"><use href="#i-back" xlink:href="#i-back"/></svg><span>Zpět</span></button>
      <div class="p-title" id="pTitle"></div>
      <div class="p-live-badge" id="pLive" hidden>Živě</div>
    </div>
    <div id="pBottom" class="p-bottom">
      <div id="pBar" class="p-bar f" data-no-drag="1" role="slider" tabindex="0" aria-label="Pozice přehrávání">
        <div class="p-track"><div class="p-buf" id="pBuf"></div><div class="p-prog" id="pProg"></div></div>
        <div class="p-knob" id="pKnob"></div>
      </div>
      <div class="p-row">
        <button id="pPlay" class="f p-btn" type="button">Přehrát</button>
        <div class="p-time" id="pTime">0:00 / 0:00</div>
        <div class="p-spacer"></div>
        <button id="pCast" class="f p-btn" type="button" style="display:none">Přehrát na TV</button>
        <button id="pSub" class="f p-btn" type="button">Titulky</button>
        <button id="pRelay" class="f p-btn" type="button">Přes server</button>
      </div>
    </div>
      <div id="pNext" class="p-next" hidden>
        <div class="p-next-head">Další video</div>
        <button id="pNextPlay" class="f p-next-media" type="button" aria-label="Přehrát další video">
          <img id="pNextImg" class="p-next-img" alt="" hidden>
          <span class="p-next-ph" aria-hidden="true"><svg class="i fill" aria-hidden="true"><use href="#i-play" xlink:href="#i-play"/></svg></span>
        </button>
        <div id="pNextTitle" class="p-next-title"></div>
        <div class="p-next-bar">
          <div id="pNextCount" class="p-next-count">Další video začne za 30 s</div>
          <div class="p-next-actions">
            <button id="pNextBack" class="f btn ghost" type="button">Zpět</button>
            <button id="pNextCancel" class="f btn ghost" type="button">Zrušit</button>
          </div>
        </div>
      </div>
    <div id="pState" class="p-state" hidden></div>
  </div>

  <!-- ===================== Obrazovková klávesnice ===================== -->
  <div id="kbd" class="overlay kbd" hidden>
    <div class="kbd-panel">
      <div class="kbd-title" id="kbdTitle">Zadej text</div>
      <div class="kbd-value" id="kbdValue"></div>
      <div class="kbd-keys" id="kbdKeys"></div>
    </div>
  </div>

  <div id="health" class="overlay health" hidden role="dialog" aria-modal="true" aria-labelledby="healthTitle">
    <div class="health-box">
      <h2 id="healthTitle">Stav služby</h2>
      <div id="healthContent" class="health-content" aria-live="polite">Načítám stav…</div>
      <div class="health-actions">
        <button class="f btn ghost" type="button" id="healthClose">← Zpět</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <div id="loading" class="loading" hidden role="status" aria-live="polite"><span class="spinner"></span><span id="loadingText">Načítám…</span></div>
</div>
<script src="hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
